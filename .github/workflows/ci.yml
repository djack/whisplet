name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: whisplet-linux-x86_64
          - os: macos-15
            artifact: whisplet-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Cache whisper.cpp build
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: deps-v3-${{ matrix.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y \
            portaudio19-dev libx11-dev libvulkan-dev \
            glslang-tools spirv-headers pkg-config
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update -q
          sudo apt-get install -y shaderc

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio pkg-config

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DVulkan_INCLUDE_DIR=/usr/include
          cmake --build build -j$(nproc)

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: make

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: build/whisplet
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Rename binaries
        run: |
          mv artifacts/whisplet-linux-x86_64/whisplet  artifacts/whisplet-linux-x86_64
          mv artifacts/whisplet-macos-arm64/whisplet   artifacts/whisplet-macos-arm64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/whisplet-linux-x86_64
            artifacts/whisplet-macos-arm64
          generate_release_notes: true
